services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-time-zone=+09:00"]
    environment:
      MYSQL_DATABASE: campus_remarket
      MYSQL_USER: ${CAMPUS_DB_USER:-campus}
      MYSQL_PASSWORD: ${CAMPUS_DB_PASSWORD:?Set CAMPUS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${CAMPUS_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: hosted
      CAMPUS_DB_URL: jdbc:mysql://db:3306/campus_remarket?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true
      CAMPUS_DB_USER: ${CAMPUS_DB_USER:-campus}
      CAMPUS_DB_PASSWORD: ${CAMPUS_DB_PASSWORD:?Set CAMPUS_DB_PASSWORD in .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:${CAMPUS_APP_PORT:-8080}:8080"
    volumes:
      - campus_uploads:/var/lib/campus/uploads

  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      CAMPUS_DOMAIN: ${CAMPUS_DOMAIN:-}
    command:
      - sh
      - -ec
      - |
        : "$${CAMPUS_DOMAIN:?Set CAMPUS_DOMAIN before enabling the https profile}"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  campus_uploads:
  caddy_data:
  caddy_config:
