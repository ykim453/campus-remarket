spring.application.name=campus-remarket-mybatis
server.port=${PORT:8080}
spring.datasource.url=${CAMPUS_DB_URL:jdbc:mysql://localhost:3306/campus_remarket?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${CAMPUS_DB_USER:campus}
spring.datasource.password=${CAMPUS_DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:calendar-schema.sql
spring.sql.init.data-locations=classpath:reference-data.sql
spring.sql.init.encoding=UTF-8
mybatis.type-aliases-package=com.campus.remarket.dto
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

spring.jackson.time-zone=Asia/Seoul
integrations.google-maps-key=${GOOGLE_MAPS_API_KEY:}

# MyBatis와 JPA가 같은 DB를 사용하며, JPA는 SQL로 만든 회원 스키마를 검증합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
server.error.include-message=always
campus.mail.mock=${CAMPUS_MAIL_MOCK:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# v10 actual member login integration: no demo fallback
campus.demo-user-enabled=false
campus.rating.good-delta=1
campus.rating.bad-delta=-1

# v14 external notification delivery: explicitly enable after configuring services.
campus.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
campus.notifications.solapi-key=${SOLAPI_API_KEY:}
campus.notifications.solapi-secret=${SOLAPI_API_SECRET:}
campus.notifications.solapi-url=https://api.solapi.com/messages/v4/send-many/detail
campus.notifications.sms-from=${SMS_FROM:}
campus.notifications.kakao-pf-id=${KAKAO_PF_ID:}
campus.notifications.kakao-template-id=${KAKAO_TEMPLATE_ID:}
campus.notifications.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${SMTP_SSL_CHECK_SERVER_IDENTITY:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Original teammate signup upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
campus.upload-dir=./uploads
server.tomcat.max-part-count=20

campus.geocoding.kakao-key=${KAKAO_REST_API_KEY:}
